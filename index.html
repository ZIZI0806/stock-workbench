<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板 · 仓位管家</title>
<link rel="stylesheet" href="assets/app.css?v=20260916233028">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">

    <div class="page-h">
      <h1>看板</h1>
      <span class="sub" id="pgSub">行情判断由人做，系统只做数学比较与查表</span>
      <span class="right toolbar">
        <span id="pvSlot"></span>
        <button class="btn sm" id="btnEval">跑一遍评估</button>
        <button class="btn sm primary" id="btnSync">同步日K</button>
      </span>
    </div>

    <!-- ① 大结构统计条 -->
    <div class="statbar" id="statbar" style="margin-bottom:24px"></div>

    <!-- ② 指数基准带 -->
    <div class="card" style="margin-bottom:24px">
      <div class="card-h">
        <h2>指数基准带</h2>
        <span class="sub">主指数方向标签 · 人工设定，压制系统判断</span>
      </div>
      <div class="idxrow" id="indexBand"></div>
    </div>

    <div class="grid2" style="margin-bottom:24px;align-items:start">
      <!-- ④ 操作提示栏 -->
      <div class="card" id="alertCard">
        <div class="card-h">
          <h2>操作提示栏</h2>
          <span class="sub" id="alertSub"></span>
          <span class="right"><button class="btn sm ghost" id="btnHandleAll">全部标记已处理</button></span>
        </div>
        <div id="alerts"></div>
      </div>

      <!-- ③ 哨兵热度面板 -->
      <div class="card">
        <div class="card-h">
          <h2>哨兵热度</h2>
          <span class="sub">只提醒，永不改标签 · 每标的 ≤2 条</span>
        </div>
        <div id="sentinels"></div>
      </div>
    </div>

    <!-- ⑤ 态势列表 -->
    <div class="card pad0">
      <div class="card-h" style="padding:24px 24px 0;margin-bottom:12px">
        <h2>态势列表</h2>
        <span class="sub" id="listSub"></span>
        <span class="right">
          <span class="seg" id="filterSeg">
            <button data-f="all" class="on">全部</button>
            <button data-f="right">右侧</button>
            <button data-f="base">筑底</button>
            <button data-f="left">左侧</button>
          </span>
        </span>
      </div>
      <div style="overflow:auto;max-height:70vh">
        <table class="tbl" id="tbl">
          <thead><tr>
            <th>标的</th><th>方向</th><th style="text-align:right">现价</th>
            <th style="width:120px">今日</th><th style="width:150px">结构进度</th>
            <th>在等什么</th><th style="text-align:right">带宽分位</th>
            <th style="text-align:right">剧本收益</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="data/data.js?v=20260916233028"></script>
<script src="assets/app.js?v=20260916233028"></script>
<script>
let DATA = null, FILTER = "all", POLL = null;

function renderStat(s) {
  const conf = [
    ["right", "右侧", "已站上颈线，规则全开"],
    ["base",  "筑底", "标签压制：只留自动流转与哨兵"],
    ["left",  "左侧", "标签压制：只留自动流转与哨兵"],
    ["undecided", "未定", "未设定方向标签"],
  ];
  $("#statbar").innerHTML = conf.map(([k, cn, tip]) => {
    const arr = (s && s[k]) || [];
    return `<div class="it ${arr.length ? "" : "off"}" data-f="${k}" title="${tip}">
      <span class="lab ${k}">${cn}</span>
      <span class="n">${arr.length}</span>
      <span class="tiny" style="max-width:190px;line-height:1.4">${arr.length ? esc(arr.join(" · ")) : "—"}</span>
    </div>`;
  }).join("");
  $$("#statbar .it").forEach(el => el.onclick = () => {
    const f = el.dataset.f;
    FILTER = (FILTER === f) ? "all" : f;
    $$("#filterSeg button").forEach(b => b.classList.toggle("on", b.dataset.f === FILTER));
    renderTable();
  });
}

function renderIndex(list) {
  if (!list || !list.length) return $("#indexBand").innerHTML = emptyBox("未录入指数");
  $("#indexBand").innerHTML = list.map(x => `
    <div class="idx">
      <div class="top">
        <span class="nm">${esc(x.name)}</span>
        ${lab(x.label, x.code)}
        <span class="tiny" style="margin-left:auto">${esc(x.phase_cn || "")}</span>
      </div>
      <div class="px ${pctClass(x.pct_chg)}">${n(x.close, 2)}</div>
      <div class="spark">${sparkline(x.spark, 200, 34, (x.pct_chg || 0) >= 0)}</div>
      <div class="ft">${chip(x.pct_chg)}
        <span class="tiny mono" style="margin-left:auto">${esc(x.bar || "")}</span></div>
      ${x.quote_time ? `<div class="tiny" style="margin-top:6px">报价 ${esc(x.quote_time)}</div>` : ""}
      <div data-pv="${x.code}">${pvHtml(x.preview)}</div>
    </div>`).join("");
}

function renderAlerts(alist) {
  const box = $("#alerts");
  if (!alist || !alist.length) {
    $("#alertSub").textContent = "今日无信号 —— 未触发就是未触发，不需要解释";
    return box.innerHTML = emptyBox("今日无信号");
  }
  const fresh = alist.filter(a => !a.handled);
  $("#alertSub").textContent = `共 ${alist.length} 条，未处理 ${fresh.length} 条`;
  const TIER = { 1: "今日触发", 2: "临门一脚", 3: "逼近中", 4: "有变化" };
  box.innerHTML = alist.map(a => `
    <div class="alert p${a.priority} ${a.handled ? "done" : ""}" data-id="${a.id}">
      <div class="h">${pri(a.priority)}<b>${esc(a.title)}</b>
        <span class="nm">${esc(a.name)} <span class="cd">${esc(a.code)}</span></span>
        <span class="tiny" style="margin-left:auto">${esc(TIER[a.tier] || "")}</span>
        <span class="act">
          <a class="btn sm ghost" href="detail.html?code=${encodeURIComponent(a.code)}">详情</a>
          ${a.handled ? "" : `<button class="btn sm ghost" data-h="${a.id}">已处理</button>`}
        </span>
      </div>
      ${a.detail ? `<div class="d">${esc(a.detail)}</div>` : ""}
    </div>`).join("");
  /* 写操作一律吞掉异常：post() 自己已给过 toast（快照模式下提示去本机操作），
     这里再抛出去只会变成 unhandledRejection。 */
  $$("#alerts [data-h]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    try { await post("/api/handle", { ids: [Number(b.dataset.h)] });
          toast("已标记处理"); load(); } catch (err) { }
  });
  $("#btnHandleAll").onclick = async () => {
    const ids = fresh.map(a => a.id);
    if (!ids.length) return toast("没有未处理信号");
    try { await post("/api/handle", { ids }); toast(`已处理 ${ids.length} 条`); load(); }
    catch (err) { }
  };
}

function renderSentinels(list) {
  const box = $("#sentinels");
  if (!list || !list.length) return box.innerHTML = emptyBox("未设哨兵。哨兵是「我记得这里有个价」，只提醒不改标签。");
  const HEAT = { face: ["up", "已贴上"], near: ["warn", "接近"], quiet: ["flat", "安静"] };
  box.innerHTML = `<table class="tbl mini"><thead><tr>
      <th>标的</th><th style="text-align:right">哨兵价</th><th style="text-align:right">现价</th>
      <th style="text-align:right">距离</th><th>热度</th></tr></thead><tbody>
    ${list.map(s => {
      const [cls, cn] = HEAT[s.heat] || HEAT.quiet;
      return `<tr>
        <td><a href="detail.html?code=${encodeURIComponent(s.code)}"><b>${esc(s.name)}</b></a>
          <div class="cd">${esc(s.direction === "up" ? "向上触" : "向下触")} 
          ${s.source_ref ? esc(s.source_ref) : ""}</div></td>
        <td class="n" style="text-align:right">${n(s.price, 2)}</td>
        <td class="n" style="text-align:right">${n(s.close, 2)}</td>
        <td class="n ${pctClass(s.dist)}" style="text-align:right">${sgn(s.dist, 1)}</td>
        <td><span class="chip ${cls}">${cn}</span>
          ${s.days != null ? `<div class="tiny">≈${s.days} 日波动</div>` : ""}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

function renderTable() {
  const rows = (DATA.rows || []).filter(r => FILTER === "all" || r.label === FILTER);
  $("#listSub").textContent = `${rows.length} 只${FILTER === "all" ? "" : " · 已筛选" + (LABEL_CN[FILTER] || "")}`;
  const tb = $("#tbl tbody");
  if (!rows.length) return tb.innerHTML = `<tr><td colspan="8">${emptyBox("没有符合条件的标的")}</td></tr>`;
  tb.innerHTML = rows.map(r => {
    if (r.empty) return `<tr><td colspan="8"><b>${esc(r.name)}</b> ${esc(r.code)} — <span class="muted">${esc(r.waiting)}</span></td></tr>`;
    return `<tr data-code="${r.code}">
      <td><a href="detail.html?code=${encodeURIComponent(r.code)}"><span class="nm">${esc(r.name)}</span></a>
        <div class="cd">${esc(r.code)} · ${esc(r.sector || "")} · ${esc(r.pool_cn || "")}
        ${r.rounds > 1 ? ` · 第${r.round_no}轮/${r.rounds}` : ""}</div></td>
      <td>${lab(r.label, r.code)}<div class="tiny">${displayTag(r.display, r.phase_cn)}</div></td>
      <td class="num" style="text-align:right;font-weight:600">${n(r.close, 2)}
        <div class="cd">${esc(r.date || "")}</div></td>
      <td>${chip(r.pct_chg)}<div class="tiny">${esc(r.phase_cn || "")}</div></td>
      <td>${bar(r.bar_kind, r.bar_val)}
        <div class="tiny mono" style="margin-top:4px">${esc(r.bar_label || "")}</div>
        <div data-pv="${r.code}">${pvHtml(r.preview)}</div></td>
      <td class="wait">${esc(r.waiting || "")}</td>
      <td style="text-align:right">${r.bw_pct != null
        ? `<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
             ${ring(r.bw_pct, 30)}<span class="tiny">${esc(r.bw_state === "low" ? "低温" : r.bw_state === "high" ? "高温" : "常态")}</span>
           </div>` : "—"}</td>
      <td class="num" style="text-align:right">${r.scenario != null
        ? `<span class="${pctClass(r.scenario)}" style="font-weight:600">${sgn(r.scenario, 1)}</span>` : "—"}</td>
    </tr>`;
  }).join("");
  $$("#tbl tbody tr[data-code]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("a")) return;
    location.href = "detail.html?code=" + encodeURIComponent(tr.dataset.code);
  });
}

async function load() {
  const d = await api("/api/dashboard");
  DATA = d;
  renderStat(d.stat); renderIndex(d.index_band); renderAlerts(d.alerts);
  renderSentinels(d.sentinels); renderTable(); paintFoot(d.meta);
  bindLabelPicker(d, load);
  /* 盘中预演：徽章 + 轻量轮询（只打 /api/preview，不重算结构） */
  const sess = (d.meta || {}).session;
  paintPreviewBadge(sess);
  if (!POLL) POLL = startPreviewPoll(sess, paintPreviews);
  const latest = (d.index_band || []).map(x => x.quote_time).filter(Boolean)[0];
  $("#pgSub").textContent = latest
    ? `报价时间 ${latest} · 数据 ${d.meta.latest_bar || "—"}`
    : "行情判断由人做，系统只做数学比较与查表";
}

$$("#filterSeg button").forEach(b => b.onclick = () => {
  FILTER = b.dataset.f;
  $$("#filterSeg button").forEach(x => x.classList.toggle("on", x === b));
  renderTable();
});

$("#btnEval").onclick = async () => {
  const b = $("#btnEval"); b.disabled = true; b.textContent = "评估中…";
  try { const r = await post("/api/evaluate", {}); toast(`评估完成，信号 ${r.signals != null ? r.signals : r.count || 0} 条`); await load(); }
  catch (e) { toast("评估失败：" + e.message, true); }
  finally { b.disabled = false; b.textContent = "跑一遍评估"; }
};
$("#btnSync").onclick = async () => {
  const b = $("#btnSync"); b.disabled = true; b.textContent = "同步中…";
  try {
    const r = await post("/api/sync", {});
    const bad = (r.results || []).filter(x => x.error);
    toast(bad.length ? `同步完成，${bad.length} 只失败` : "同步完成", !!bad.length);
    await load();
  } catch (e) { toast("同步失败：" + e.message, true); }
  finally { b.disabled = false; b.textContent = "同步日K"; }
};

mountNav("/");
load().catch(e => { toast("加载失败：" + e.message, true); $("#pgSub").textContent = e.message; });
</script>
</body>
</html>
